<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    headwordapp.com/appstore: the short link to the App Store page, for anywhere a bare
    apps.apple.com URL would be ugly or might change. Apple's id-only form resolves to the
    visitor's own storefront, so there is no country in it. No script, by the site's own rule:
    a meta refresh is enough.
  -->
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6807881378">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://apps.apple.com/app/id6807881378">
  <title>Headword on the App Store</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <p class="lead">Taking you to <a href="https://apps.apple.com/app/id6807881378">Headword on the App Store</a>.</p>
</main>
</body>
</html>
