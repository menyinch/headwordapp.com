<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    The link in the Instagram (boosted post) bio. The profile points here once and is never edited again;
    this page is what changes. Today it goes to the landing page (ask to be told when the
    app ships). The day the App Store link is live, replace the URL in the two places below
    with the campaign link for the token "instagram-paid", made in App Store Connect under
    App Analytics → Campaigns (…?pt=<team>&ct=instagram-paid&mt=8), so the store reports installs
    from this link by name. No script, by the site's own rule: a meta refresh is enough.
  -->
  <meta http-equiv="refresh" content="0; url=https://headwordapp.com/">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://headwordapp.com/">
  <title>Headword</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <p class="lead">Taking you to <a href="https://headwordapp.com/">Headword</a>.</p>
</main>
</body>
</html>
